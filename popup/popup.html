<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-yas-i18n="manifestName">Anti-Spoiler for YouTube</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="shell">
      <div class="hero-wrap">
        <!-- The capsule repeats the logo: red, crossed by a dark band, with the
             play triangle half hidden behind the band. The whole capsule is the
             label of the master switch, so a click anywhere on it toggles
             protection. A label may hold only inline content, hence the spans. -->
        <label class="hero" data-hero>
          <span class="hero-top">
            <span class="hero-name" data-yas-i18n="popupName">Anti-Spoiler</span>
            <svg class="hero-play" viewBox="0 0 25 27" aria-hidden="true"><path d="M0 0v27l25-13.5z" fill="#fff"/></svg>
          </span>
          <span class="hero-band">
            <span class="hero-band-text">
              <span class="hero-title" data-power-status>Protection on</span>
              <span class="hero-note" data-power-note>Video time and duration are hidden</span>
            </span>
            <span class="switch">
              <input
                type="checkbox"
                role="switch"
                data-power-toggle
                data-yas-i18n-label="popupMasterSwitchLabel"
                aria-label="Spoiler protection"
              >
              <span aria-hidden="true"></span>
            </span>
          </span>
          <span class="hero-bottom"></span>
        </label>
        <!-- Outside the label, so a click on them never toggles protection.
             The language list is a real select laid invisibly over the chip,
             so a click on the chip opens the native list. -->
        <div class="hero-tools">
          <span class="chip chip-language">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.7 3.8 5.7 3.8 9s-1.3 6.3-3.8 9c-2.5-2.7-3.8-5.7-3.8-9S9.5 5.7 12 3z"/></svg>
            <span data-language-code>EN</span>
            <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
            <select data-language-select data-yas-i18n-label="popupLanguageLabel" aria-label="Language"></select>
          </span>
          <button type="button" class="chip chip-icon" data-theme-toggle data-yas-i18n-label="popupThemeAuto" aria-label="Theme: automatic">
            <svg data-theme-icon="auto" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 6.5a5.5 5.5 0 0 0 0 11z" fill="currentColor"/><path d="M12 6.5a5.5 5.5 0 0 1 0 11z"/><path d="M12 2v2M12 20v2M19.1 4.9l-1.4 1.4M19.1 19.1l-1.4-1.4M20 12h2"/></svg>
            <svg data-theme-icon="light" hidden viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
            <svg data-theme-icon="dark" hidden viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          </button>
        </div>
      </div>

      <p class="status" data-status aria-live="polite"></p>

      <!-- The main settings. Hidden while protection is off. -->
      <div class="card" data-settings-panel>
        <label class="row">
          <span class="row-text">
            <span class="row-title" data-yas-i18n="popupHideProgressBar">Hide progress bar</span>
            <span class="row-note" data-yas-i18n="popupHideProgressBarNote">In the player and in previews</span>
          </span>
          <span class="toggle">
            <input type="checkbox" data-setting="hidePlayerProgressBar">
            <span aria-hidden="true"></span>
          </span>
        </label>
        <label class="row">
          <span class="row-text">
            <span class="row-title" data-yas-i18n="popupBlurPreviews">Blur previews</span>
            <span class="row-note" data-yas-i18n="popupBlurPreviewsNote">Thumbnails and hover previews</span>
          </span>
          <span class="toggle">
            <input type="checkbox" data-setting="hideVideoPreviews">
            <span aria-hidden="true"></span>
          </span>
        </label>
        <label class="row">
          <span class="row-text">
            <!-- Two spans: a translation replaces the text of its own span only.
                 "Beta" stays English in every language (owner, 2026-11-06);
                 its hover tooltip is translated. -->
            <span class="row-title"><span data-yas-i18n="popupProtectLive">Protect live streams</span> <span class="badge" data-yas-i18n-label="popupBetaNote" aria-label="Still being tested: it may not always work as expected" title="Still being tested: it may not always work as expected">Beta</span></span>
            <span class="row-note" data-yas-i18n="popupProtectLiveNote">Pause at the start and hide live chat</span>
          </span>
          <span class="toggle">
            <input type="checkbox" data-setting="startLiveFromBeginning">
            <span aria-hidden="true"></span>
          </span>
        </label>
      </div>

      <!-- Only settings inside, so the whole card hides while protection is
           off. The language lives in the capsule and is always reachable. -->
      <details class="card advanced" data-settings-panel>
        <summary class="advanced-summary">
          <span data-yas-i18n="popupAdvancedSettings">Advanced settings</span>
        </summary>
        <label class="row">
          <span class="row-text">
            <span class="row-title" data-yas-i18n="popupBlurTitles">Blur video titles</span>
            <span class="row-note" data-yas-i18n="popupBlurTitlesNote">In lists, on the video page and in end cards</span>
          </span>
          <span class="toggle">
            <input type="checkbox" data-setting="hideVideoTitles">
            <span aria-hidden="true"></span>
          </span>
        </label>
        <label class="row">
          <span class="row-text">
            <span class="row-title" data-yas-i18n="popupHideComments">Hide comments</span>
            <span class="row-note" data-yas-i18n="popupHideCommentsNote">Show them with one click</span>
          </span>
          <span class="toggle">
            <input type="checkbox" data-setting="hideComments">
            <span aria-hidden="true"></span>
          </span>
        </label>
      </details>

      <!-- Outside the settings panels, so it shows while protection is off
           and in read-only mode too. The address is not translated. -->
      <footer class="contact">
        <span data-yas-i18n="popupContactLabel">Questions or ideas?</span>
        <a href="mailto:vtshka8@gmail.com">vtshka8@gmail.com</a>
      </footer>
    </main>

    <script src="../src/shared/settings.js"></script>
    <script src="../src/shared/i18n.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
