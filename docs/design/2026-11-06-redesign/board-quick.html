<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Быстрый доступ к языку и теме</title>
<style>
  body { margin: 0; padding: 24px; background: #dcdcde; font-family: system-ui, "Segoe UI", sans-serif; color: #222; width: max-content; }
  h1 { margin: 0 0 4px; font-size: 22px; }
  p.lead { margin: 0 0 20px; color: #555; font-size: 14px; }
  .row { display: flex; gap: 28px; align-items: flex-start; margin-bottom: 28px; }
  figure { margin: 0; }
  figcaption { font-size: 15px; font-weight: 700; margin-bottom: 8px; }
  figcaption span { display: block; font-size: 12px; font-weight: 400; color: #555; max-width: 340px; }
  img { width: 340px; display: block; border-radius: 10px; box-shadow: 0 6px 20px rgba(0,0,0,.18); }
</style>
</head>
<body>
  <h1>Попап Anti-Spoiler: язык и тема под рукой</h1>
  <p class="lead">Светлая тема сверху, тёмная снизу. Защита включена, «Дополнительно» свёрнуто. Тема во всех вариантах — «Авто».</p>
  <div class="row">
    <figure><figcaption>Сейчас<span>Язык спрятан в «Дополнительно», переключателя темы нет.</span></figcaption><img src="shots/r3-popup-light.png"></figure>
    <figure><figcaption>A. Нижняя панель<span>Строка под карточками: язык и тема, +40 px. Выбор Argon.</span></figcaption><img src="shots/quick-a-light.png"></figure>
    <figure><figcaption>B. Значки в шапке<span>Две таблетки в красной шапке, высота не растёт.</span></figcaption><img src="shots/quick-b-light.png"></figure>
    <figure><figcaption>C. В строке „Дополнительно“<span>Язык и тема справа в той же строке. Выбор Codex.</span></figcaption><img src="shots/quick-c-light.png"></figure>
  </div>
  <div class="row">
    <figure><img src="shots/r3-popup-dark.png"></figure>
    <figure><img src="shots/quick-a-dark.png"></figure>
    <figure><img src="shots/quick-b-dark.png"></figure>
    <figure><img src="shots/quick-c-dark.png"></figure>
  </div>
</body>
</html>
