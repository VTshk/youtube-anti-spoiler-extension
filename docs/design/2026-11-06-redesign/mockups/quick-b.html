<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Option B: hero-cap chips</title>
    <!-- Static mockup: a copy of popup/popup.css and popup/popup.html, no JS. -->
    <style>
:root {
  color-scheme: light dark;
  --bg: #f4f2f0;
  --surface: #ffffff;
  --text: #18181b;
  --muted: #57534e;
  --line: #e8e4e0;
  --control-border: #757067;
  --focus: #18181b;
  --accent: #c85252;
  --error: #b33939;
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #141416;
    --surface: #1e1e22;
    --text: #f4f4f5;
    --muted: #a8a29e;
    --line: #2e2e34;
    --control-border: #8a8a94;
    --focus: #ffffff;
    --error: #e06c6c;
  }
}

* {
  box-sizing: border-box;
}

[hidden] {
  display: none !important;
}

body {
  width: 352px;
  margin: 0;
  background: var(--bg);
  color: var(--text);
}

p {
  margin: 0;
}

.shell {
  padding: 12px;
}

/* The capsule repeats the logo: a red capsule crossed by a dark band. It is
   the label of the master switch. --x / --y hold the pointer position, set
   by popup.js; the centre until the pointer moves. */
.hero {
  --x: 50%;
  --y: 50%;
  position: relative;
  display: block;
  border-radius: 18px;
  overflow: hidden;
  background: var(--accent);
  cursor: pointer;
  user-select: none;
}

/* Protection off: the red turns gray, the band stays. White 19 px bold on
   #6e6e6e is 5.1:1. */
.hero:has([data-power-toggle]:not(:checked)) {
  background: #6e6e6e;
}

/* Read-only (settings failed to load): the switch is disabled, so a click
   does nothing and there is no hover effect. */
.hero:has([data-power-toggle]:disabled) {
  cursor: default;
}

/* Protection off: a soft red circle follows the pointer over the gray cap and
   bottom strip, a hint that a click turns protection back on. The band is
   drawn on top and stays solid. */
.hero::before {
  content: "";
  position: absolute;
  inset: 0;
  /* Brightest right under the pointer, fading to the logo red, then out. */
  background: radial-gradient(circle 80px at var(--x) var(--y), #ef6a6a, var(--accent) 45%);
  -webkit-mask-image: radial-gradient(circle 80px at var(--x) var(--y), #000 35%, transparent);
  mask-image: radial-gradient(circle 80px at var(--x) var(--y), #000 35%, transparent);
  opacity: 0;
  transition: opacity 0.15s;
  pointer-events: none;
}

.hero:hover:has([data-power-toggle]:enabled:not(:checked))::before {
  opacity: 1;
}

/* Positioned, so the name and the triangle are drawn above the red circle. */
.hero-top {
  position: relative;
  display: block;
  padding: 16px 14px 18px;
  color: #ffffff;
}

/* As in the logo: the triangle in the centre, its lower part behind the
   band. The band comes later in the page and is positioned, so it is drawn
   on top. */
.hero-play {
  position: absolute;
  /* About half of it behind the band, as in icons/icon.svg. */
  bottom: -20px;
  left: 50%;
  width: 37px;
  height: 40px;
  transform: translateX(-50%);
}

/* White on #c85252 is 4.39:1: enough only for large text, which 19 px
   bold is. */
.hero-name {
  font-size: 19px;
  font-weight: 800;
  letter-spacing: 0.02em;
}

.hero-band {
  position: relative;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  background: #222222;
  color: #ffffff;
  transition: background-color 0.15s;
}

/* Protection on: a calm hover, the band gets a little lighter. */
.hero:hover:has([data-power-toggle]:enabled:checked) .hero-band {
  background: #2a2a2a;
}

@media (prefers-reduced-motion: reduce) {
  .hero::before,
  .hero-band {
    transition: none;
  }
}

.hero-band-text {
  flex: 1;
  min-width: 0;
}

.hero-title {
  display: block;
  font-size: 15px;
  font-weight: 800;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.hero-note {
  display: block;
  margin-top: 2px;
  color: #c9c9c9;
  font-size: 12px;
}

.hero-bottom {
  display: block;
  height: 10px;
}

/* The master switch. The input is invisible on top of its picture, so the
   focus ring goes on the picture. */
.switch {
  position: relative;
  width: 46px;
  height: 26px;
  flex: 0 0 auto;
}

.switch input {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  margin: 0;
  opacity: 0;
  cursor: pointer;
}

.switch span {
  position: absolute;
  inset: 0;
  border-radius: 13px;
  background: #555555;
  pointer-events: none;
}

.switch span::after {
  content: "";
  position: absolute;
  top: 3px;
  left: 3px;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: #ffffff;
  transition: transform 0.15s;
}

.switch input:checked + span {
  background: var(--accent);
}

.switch input:checked + span::after {
  transform: translateX(20px);
}

/* White in light and dark themes alike: the switch sits on the dark band. */
.switch input:focus-visible + span {
  outline: 2px solid #ffffff;
  outline-offset: 2px;
}

.status {
  margin-top: 10px;
  padding: 8px 12px;
  border: 1px solid var(--error);
  border-radius: 10px;
  color: var(--error);
  font-size: 13px;
}

[data-status]:empty {
  display: none;
}

.card {
  overflow: hidden;
  margin-top: 12px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: var(--surface);
}

/* "Advanced settings": a native <details> drawn as one more card. */
.advanced-summary {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  min-height: 48px;
  padding: 9px 12px;
  font-size: 14px;
  font-weight: 600;
  list-style: none;
  cursor: pointer;
}

/* A chevron that points down while closed and up while open. */
.advanced-summary::after {
  content: "";
  flex: 0 0 auto;
  width: 7px;
  height: 7px;
  margin: 0 6px 4px 0;
  border-right: 2px solid var(--muted);
  border-bottom: 2px solid var(--muted);
  transform: rotate(45deg);
  transition: transform 0.15s;
}

.advanced[open] > .advanced-summary::after {
  margin-bottom: -4px;
  transform: rotate(225deg);
}

/* Inside the card, so the ring is drawn inward: the card clips outside. */
.advanced-summary:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: -2px;
  border-radius: 13px;
}

.advanced .row {
  border-top: 1px solid var(--line);
}

.row {
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 48px;
  padding: 9px 12px;
  cursor: pointer;
}

.row:has(input:disabled) {
  cursor: default;
}

.row + .row {
  border-top: 1px solid var(--line);
}

/* Labels and notes wrap; they are never cut off. */
.row-text {
  flex: 1;
  min-width: 0;
  overflow-wrap: anywhere;
}

.row-title {
  display: block;
  font-size: 14px;
  font-weight: 600;
}

.row-note {
  display: block;
  margin-top: 1px;
  color: var(--muted);
  font-size: 12px;
}

:is(.hero-title, .hero-note, .row-title, .row-note, .advanced-summary):is(:lang(ja), :lang(ko), :lang(zh)) {
  line-height: 1.5;
}

/* A checkbox drawn as a switch. Unchecked borders reach 3:1 on the card. */
.toggle {
  position: relative;
  width: 36px;
  height: 20px;
  flex: 0 0 auto;
}

.toggle input {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  margin: 0;
  opacity: 0;
  cursor: pointer;
}

.toggle input:disabled,
.switch input:disabled {
  cursor: default;
}

.toggle span {
  position: absolute;
  inset: 0;
  border: 2px solid var(--control-border);
  border-radius: 10px;
  pointer-events: none;
}

.toggle span::after {
  content: "";
  position: absolute;
  top: 2px;
  left: 2px;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: var(--control-border);
  transition: transform 0.15s;
}

.toggle input:checked + span {
  border-color: var(--accent);
  background: var(--accent);
}

.toggle input:checked + span::after {
  background: #ffffff;
  transform: translateX(16px);
}

/* Only the control fades; the row text keeps its contrast. */
.toggle input:disabled + span,
.switch input:disabled + span {
  opacity: 0.45;
}

.toggle input:focus-visible + span {
  outline: 2px solid var(--focus);
  outline-offset: 2px;
}

.language select {
  flex: 0 0 auto;
  padding: 4px 6px;
  border: 1px solid var(--control-border);
  border-radius: 8px;
  background: var(--surface);
  color: var(--text);
  font: inherit;
  font-size: 13px;
}

.language select:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 2px;
}


/* --- Option B: chips in the hero cap, outside the master-switch label --- */
.hero-wrap {
  position: relative;
}

.hero-tools {
  position: absolute;
  top: 16px;
  right: 12px;
  display: flex;
  gap: 6px;
}

.chip {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  height: 28px;
  padding: 0 8px 0 9px;
  border: 1px solid rgba(255, 255, 255, 0.28);
  border-radius: 14px;
  background: rgba(34, 34, 34, 0.78);
  color: #ffffff;
  font: inherit;
  font-size: 12.5px;
  font-weight: 700;
  letter-spacing: 0.02em;
  cursor: pointer;
}

.chip svg {
  width: 14px;
  height: 14px;
}

.chip .chev {
  width: 11px;
  height: 11px;
  opacity: 0.85;
}

.chip-icon {
  width: 28px;
  padding: 0;
}

.chip-icon svg {
  width: 16px;
  height: 16px;
}

    </style>
  </head>
  <body>
    <main class="shell">
      <div class="hero-wrap">
      <label class="hero" data-hero>
        <span class="hero-top">
          <span class="hero-name">Anti-Spoiler</span>
          <svg class="hero-play" viewBox="0 0 25 27" aria-hidden="true"><path d="M0 0v27l25-13.5z" fill="#fff"/></svg>
        </span>
        <span class="hero-band">
          <span class="hero-band-text">
            <span class="hero-title">Protection on</span>
            <span class="hero-note">Video time and duration are hidden</span>
          </span>
          <span class="switch">
            <input type="checkbox" role="switch" checked aria-label="Spoiler protection">
            <span aria-hidden="true"></span>
          </span>
        </span>
        <span class="hero-bottom"></span>
      </label>
        <span class="hero-tools">
          <button type="button" class="chip" aria-label="Language: English" title="Language"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.7 3.8 5.7 3.8 9s-1.3 6.3-3.8 9c-2.5-2.7-3.8-5.7-3.8-9S9.5 5.7 12 3z"/></svg>EN<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
          <button type="button" class="chip chip-icon" aria-label="Theme: Auto" title="Theme: Auto"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 6.5a5.5 5.5 0 0 0 0 11z" fill="currentColor"/><path d="M12 6.5a5.5 5.5 0 0 1 0 11z"/><path d="M12 2v2M12 20v2M19.1 4.9l-1.4 1.4M19.1 19.1l-1.4-1.4M20 12h2"/></svg></button>
        </span>
      </div>

      <div class="card">
        <label class="row">
          <span class="row-text">
            <span class="row-title">Hide progress bar</span>
            <span class="row-note">In the player and in previews</span>
          </span>
          <span class="toggle">
            <input type="checkbox" checked>
            <span aria-hidden="true"></span>
          </span>
        </label>
        <label class="row">
          <span class="row-text">
            <span class="row-title">Blur previews</span>
            <span class="row-note">Thumbnails and hover previews</span>
          </span>
          <span class="toggle">
            <input type="checkbox">
            <span aria-hidden="true"></span>
          </span>
        </label>
        <label class="row">
          <span class="row-text">
            <span class="row-title">Protect live streams</span>
            <span class="row-note">Pause at the start and hide live chat</span>
          </span>
          <span class="toggle">
            <input type="checkbox" checked>
            <span aria-hidden="true"></span>
          </span>
        </label>
      </div>

      <details class="card advanced">
        <summary class="advanced-summary">
          <span class="advanced-label">Advanced settings</span>
        </summary>
        <div>
        <label class="row">
          <span class="row-text">
            <span class="row-title">Blur video titles</span>
            <span class="row-note">In lists, on the video page and in end cards</span>
          </span>
          <span class="toggle">
            <input type="checkbox">
            <span aria-hidden="true"></span>
          </span>
        </label>
        <label class="row">
          <span class="row-text">
            <span class="row-title">Hide comments</span>
            <span class="row-note">Show them with one click</span>
          </span>
          <span class="toggle">
            <input type="checkbox" checked>
            <span aria-hidden="true"></span>
          </span>
        </label>
        </div>
      </details>
    </main>
  </body>
</html>
