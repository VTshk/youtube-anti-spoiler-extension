<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>A — Protection band</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f5f5; --text: #222222; --muted: #606060; --line: #dddddd;
    --band: #222222; --band-text: #ffffff; --band-muted: #bbbbbb;
    --accent: #c85252; --control-border: #777777; --focus: #222222;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #171717; --text: #f5f5f5; --muted: #bbbbbb; --line: #333333;
      --band: #262626; --control-border: #999999; --focus: #ffffff;
    }
  }
  * { box-sizing: border-box; }
  body { width: 360px; margin: 0; background: var(--bg); color: var(--text); }
  .shell { padding: 14px 14px 12px; }

  .header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .logo { width: 59px; height: 32px; }
  .name { font-size: 16px; font-weight: 700; line-height: 1.15; }
  .name small { display: block; font-size: 12px; font-weight: 500; color: var(--muted); }

  .band {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 14px; border-radius: 14px;
    background: var(--band); color: var(--band-text);
  }
  .band-text { flex: 1; }
  .band-title { font-size: 16px; font-weight: 700; }
  .band-note { font-size: 12px; color: var(--band-muted); margin-top: 2px; }

  .switch { position: relative; width: 44px; height: 26px; flex: 0 0 auto; }
  .switch input { position: absolute; inset: 0; margin: 0; opacity: 0; cursor: pointer; }
  .switch span { position: absolute; inset: 0; border-radius: 13px; background: #5a5a5a; transition: background .15s; }
  .switch span::after {
    content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px;
    border-radius: 50%; background: #fff; transition: transform .15s;
  }
  .switch input:checked + span { background: var(--accent); }
  .switch input:checked + span::after { transform: translateX(18px); }

  .group { margin-top: 14px; }
  .group-title {
    font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
    color: var(--muted); margin: 0 0 2px;
  }
  .row {
    display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 6px 0;
    border-bottom: 1px solid var(--line); cursor: pointer;
  }
  .group .row:last-child { border-bottom: 0; }
  .row-text { flex: 1; }
  .row-title { font-size: 14px; font-weight: 600; }
  .row-note { font-size: 12px; color: var(--muted); margin-top: 1px; }
  .row.nested { padding-left: 16px; position: relative; }
  .row.nested::before {
    content: ""; position: absolute; left: 4px; top: 0; bottom: 50%;
    width: 8px; border-left: 2px solid var(--line); border-bottom: 2px solid var(--line);
    border-bottom-left-radius: 6px;
  }

  .check {
    appearance: none; margin: 0; width: 20px; height: 20px; flex: 0 0 auto;
    border: 2px solid var(--control-border); border-radius: 5px; display: grid; place-items: center; cursor: pointer;
  }
  .check::after {
    content: ""; width: 5px; height: 10px; margin-top: -2px; border: solid #fff;
    border-width: 0 2px 2px 0; transform: rotate(45deg); opacity: 0;
  }
  .check:checked { background: var(--accent); border-color: var(--accent); }
  .check:checked::after { opacity: 1; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  .footer { margin-top: 12px; font-size: 12px; color: var(--muted); }
  kbd {
    font: inherit; font-weight: 600; color: var(--text);
    padding: 1px 6px; border: 1px solid var(--line); border-radius: 5px;
  }
</style>
</head>
<body>
<main class="shell">
  <header class="header">
    <img class="logo" src="../../../../icons/icon.svg" alt="">
    <div class="name">Anti-Spoiler<small>for YouTube</small></div>
  </header>

  <section class="band">
    <div class="band-text">
      <div class="band-title">Protection on</div>
      <div class="band-note">Video time and duration are hidden</div>
    </div>
    <label class="switch"><input type="checkbox" role="switch" aria-label="Protection" checked><span></span></label>
  </section>

  <section class="group">
    <h2 class="group-title">Player</h2>
    <label class="row">
      <span class="row-text"><div class="row-title">Hide progress bar</div><div class="row-note">In the player and in previews</div></span>
      <input class="check" type="checkbox" checked>
    </label>
    <label class="row nested">
      <span class="row-text"><div class="row-title">Skip buttons</div><div class="row-note">Jump 10 s, 1 min or 10 min</div></span>
      <input class="check" type="checkbox" checked>
    </label>
  </section>

  <section class="group">
    <h2 class="group-title">Around videos</h2>
    <label class="row">
      <span class="row-text"><div class="row-title">Blur previews</div><div class="row-note">Thumbnails and hover previews</div></span>
      <input class="check" type="checkbox">
    </label>
    <label class="row">
      <span class="row-text"><div class="row-title">Blur video titles</div><div class="row-note">In lists, on the video page and in end cards</div></span>
      <input class="check" type="checkbox">
    </label>
    <label class="row">
      <span class="row-text"><div class="row-title">Hide comments</div><div class="row-note">Show them with one click</div></span>
      <input class="check" type="checkbox" checked>
    </label>
  </section>

  <section class="group">
    <h2 class="group-title">Live streams</h2>
    <label class="row">
      <span class="row-text"><div class="row-title">Protect live streams</div><div class="row-note">Pause at the start and hide live chat</div></span>
      <input class="check" type="checkbox" checked>
    </label>
  </section>

  <p class="footer">Turn on or off: <kbd>Alt+Shift+S</kbd></p>
</main>
</body>
</html>
